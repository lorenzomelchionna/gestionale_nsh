# Chi va a vedere se è uscita una versione con una falla corretta.
#
# Finora: nessuno. È il motivo per cui il DoS di `python-multipart`
# (GHSA-5rvq-cxj2-64vf) è rimasto scoperto venti mesi — non perché fosse
# difficile da correggere, ma perché niente lo segnalava, e una dipendenza
# ferma non genera nessun evento a cui reagire.
#
# Dependabot apre le pull request; `.github/workflows/audit.yml` dice quali
# servono davvero. Sono due metà della stessa cosa: l'audit trova, Dependabot
# porta la correzione già scritta.
#
# **Il raggruppamento non è cosmetico.** Senza, ogni aggiornamento è una PR a
# sé: qui vuol dire una decina a settimana su un progetto seguito da una
# persona sola. Una casella di posta piena di PR non lette è un meccanismo
# spento, quindi le patch arrivano insieme e restano leggibili.
version: 2

updates:
  # ── Backend Python ──────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch e minor insieme: sono le versioni che per contratto non
      # cambiano il comportamento, quindi o passano i test tutte insieme o
      # c'è qualcosa da guardare comunque.
      python-minori:
        patterns: ["*"]
        # **Le esclusioni qui sotto le ha scritte la realtà, non la prudenza.**
        #
        # Al primo giro Dependabot ha messo `fastapi` 0.115.6 → 0.141.1 dentro
        # questo gruppo, insieme ad altri sedici aggiornamenti. Il motivo è che
        # sotto la 1.0 la major è `0`: per semver ogni rilascio di FastAPI è un
        # *minor*, quindi la riga `ignore` più sotto non lo prendeva.
        #
        # Quell'aggiornamento è però un lavoro, non un bump: la FastAPI nuova
        # avvolge le rotte in `_IncludedRouter` e `test_permissions_matrix.py`
        # smette di vederle. La CI l'ha infatti bloccato — la rete ha tenuto —
        # ma il risultato era che sedici aggiornamenti buoni restavano fermi
        # dietro a uno che nessuno poteva mergiare.
        #
        # Quindi le librerie che stanno sotto la 1.0, o che hanno una storia di
        # rotture fra minor, escono dal gruppo e prendono una PR ciascuna.
        exclude-patterns:
          - "fastapi"
          - "starlette"
          - "sqlalchemy"
          - "pydantic*"
        update-types: ["minor", "patch"]
    ignore:
      # Le major restano fuori dal gruppo e vengono aperte una per una: una
      # major in mezzo a dieci aggiornamenti rende impossibile capire chi ha
      # rotto cosa. Attenzione al limite visto sopra: per un pacchetto `0.x`
      # questa riga non scatta mai, perché la major è già `0`.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Frontend ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Diviso fra ciò che finisce nel browser e ciò che serve solo a
      # costruire: un buco in `axios` lo vedono le clienti, uno in `vite` lo
      # vede chi compila. Sono due urgenze diverse e vanno lette separate.
      frontend-runtime:
        dependency-type: production
        update-types: ["minor", "patch"]
      frontend-strumenti:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Le action della CI ──────────────────────────────────────────────
  # Girano con accesso al repository e ai suoi segreti: una action
  # compromessa è un problema di sicurezza, non di manutenzione.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
