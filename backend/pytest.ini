[pytest]
testpaths = tests
asyncio_mode = auto
# Fixtures share the loop the test runs in. They are all function-scoped, and a
# session-scoped fixture loop would open connections on one loop and close them
# on another — the same cross-loop trap the Celery tasks hit in production.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:passlib.*
