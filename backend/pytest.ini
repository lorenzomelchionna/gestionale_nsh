[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop per session: the test engine and its connection pool are
# session-scoped, and a per-test loop would leave them bound to a closed loop
# (the same trap the Celery tasks hit in production).
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning:passlib.*
