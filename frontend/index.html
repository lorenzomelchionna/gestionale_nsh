<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout paint under the iOS notch/home bar,
         which the safe-area-inset paddings then compensate for. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1611" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="New Style Hair" />
    <title>New Style Hair</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cormorant Garamond sets the headings and the buttons, Lora the body.
         Only the two cuts each side actually uses, so the block stays small. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- The wordmark is painted as a CSS mask; warm it early so the dark bar
         does not render empty on a cold cache. -->
    <link rel="preload" as="image" href="/nsh-logo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
