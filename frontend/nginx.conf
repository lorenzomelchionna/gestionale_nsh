server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # React Router — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names which bundle to load, so it is the one file that must
    # never be reused without asking. Left uncached it got no Cache-Control at
    # all, and browsers fall back to guessing how long to keep it: a stale copy
    # then pointed at an old bundle, which kept talking to the API the way the
    # previous release did. Revalidating costs one conditional request.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Everything else carries a content hash in its name, so a change means a
    # new URL and these can be kept indefinitely.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
}
