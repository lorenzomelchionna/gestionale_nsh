# The Railway-generated address serves this same app, but the API only
# accepts https://www.newstylehair.it as an origin: from here every call that
# needs a CORS preflight — sign-in, registration — failed with "Disallowed
# CORS origin", while the page looked perfectly normal. Clients who signed up
# before the custom domain existed still had it bookmarked. Sending them to
# the real address fixes that and keeps one origin, one set of stored logins.
#
# Only this host, by name. A catch-all "not www → redirect" would also answer
# Railway's healthcheck (a different Host) with a 301, and it wants a 200.
server {
    listen ${PORT};
    server_name happy-benevolence-production.up.railway.app;
    return 301 https://www.newstylehair.it$request_uri;
}

# `default_server` is load-bearing: without it nginx makes the first block —
# the redirect above — the default, and www would redirect to itself forever
# (tested: www and the healthcheck both got a 301).
server {
    listen ${PORT} default_server;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names which bundle to load, so it is the one file that must
    # never be reused without asking. Left uncached it got no Cache-Control at
    # all, and browsers fall back to guessing how long to keep it: a stale copy
    # then pointed at an old bundle, which kept talking to the API the way the
    # previous release did. Revalidating costs one conditional request.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Everything else carries a content hash in its name, so a change means a
    # new URL and these can be kept indefinitely.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
}
